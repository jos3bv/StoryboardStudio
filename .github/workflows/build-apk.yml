name: Build BV Storyboarder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # This action splits the input on spaces, not newlines.
          # Keep every SDK package on this single line.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/platform-tools"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BV-Storyboarder-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
